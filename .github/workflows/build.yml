name: Build UDX710 Tools

on:
  push:
  workflow_dispatch:

jobs:
  build-arm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash -
          sudo apt-get update
          sudo apt-get install -y nodejs gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Configure cross compiler (aarch64)
        run: |
          command -v aarch64-linux-gnu-gcc
          command -v aarch64-linux-gnu-strip
          aarch64-linux-gnu-gcc --version

      - name: build web
        run: |
          cd web
          npm install && npm run build

      - name: build server
        run: |
          cd src
          make

      - name: run tests
        run: |
          make -C tests test
          sh tests/check_routes.sh
          node tests/frontend_api_test.mjs

      - name: verify device glibc ABI
        run: |
          if readelf --version-info src/build/ofono-server | grep -q 'GLIBC_2\.34'; then
            echo "server requires GLIBC_2.34, which is unavailable on the device" >&2
            exit 1
          fi
          test "$(readelf --version-info src/build/ofono-server | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n 1)" = "GLIBC_2.17"

      - name: dopack
        run: |
          mkdir -p output/6677
          echo "#!/bin/sh" > start.sh
          echo "cd /home/root/6677" >> start.sh
          echo "chmod 755 *" >> start.sh
          echo "./server &" >> start.sh
          mv start.sh output/6677/
          cp -r web/dist output/6677/
          cp src/build/ofono-server output/6677/server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: udx710-tools
          path: output
